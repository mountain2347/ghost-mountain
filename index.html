<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIO GHOSTmountain</title>
    
    <link rel="icon" type="image/png" href="favicon.png">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Общие настройки страницы */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #e0e0e0;
            overflow-x: hidden;
            background-color: #0d0d0d;
        }

        /* --- СТАРТОВОЕ ОКНО LINUX (PRELOADER) --- */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #080808;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999; /* Выше всего на странице */
            transition: opacity 0.6s ease, visibility 0.6s;
        }

        /* Увеличенное окно терминала Linux */
        .linux-window {
            width: 90%;
            max-width: 480px; /* Сделали шире и массивнее */
            background: #1e1e1e;
            border-radius: 12px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), 0 0 25px rgba(138, 43, 226, 0.25);
            border: 1px solid #2d2d2d;
            overflow: hidden;
            animation: windowAppear 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes windowAppear {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Шапка окна Линукс */
        .window-header {
            background: #161616;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #252525;
            position: relative;
        }

        /* Контейнер для трех точек */
        .window-buttons {
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .win-btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            cursor: pointer;
            transition: filter 0.2s ease, transform 0.1s ease;
        }

        /* Цвета кнопок Linux окон */
        .win-btn.close {
            background: #ff5f56; /* Красная кнопка закрытия */
            box-shadow: 0 0 8px rgba(255, 95, 86, 0.6);
        }
        .win-btn.minimize {
            background: #ffbd2e; /* Желтая */
        }
        .win-btn.maximize {
            background: #27c93f; /* Зеленая */
        }

        /* Анимация при наведении на красную точку */
        .win-btn.close:hover {
            filter: brightness(1.3);
            transform: scale(1.15);
        }

        .window-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            font-family: monospace;
            color: #666;
            letter-spacing: 1px;
        }

        /* Просторный контент внутри окна */
        .window-content {
            padding: 65px 40px; /* Увеличили отступы вокруг цифр */
            text-align: center;
            background: #141414;
        }

        /* Крупный светящийся код 2347 с фиксированной высотой */
        .terminal-code {
            font-family: 'Courier New', Courier, monospace;
            font-size: 56px; /* Увеличили размер шрифта */
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 6px;
            margin: 0;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3), 0 0 30px rgba(138, 43, 226, 0.4);
            min-height: 65px; /* Чтобы окно не прыгало во время анимации */
        }

        /* Класс скрытия прелоадера */
        #preloader.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        /* Стиль для video на заднем фоне */
        .video-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -2;
            transform: translate(-50%, -50%);
            object-fit: cover;
            filter: blur(5px) brightness(60%); 
        }

        /* Контейнер для эффекта падающего пепла */
        #ash-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .ash-particle {
            position: absolute;
            background: rgba(150, 150, 150, 0.35);
            border-radius: 50%;
            pointer-events: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10px) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% {
                transform: translateY(105vh) translateX(70px) rotate(360deg);
                opacity: 0;
            }
        }

        /* Затемняющий слой поверх видео для мрачной атмосферы */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 13, 13, 0.5);
            z-index: -1;
        }

        /* Контейнер сайта с измененной логикой появления */
        .bio-container {
            background: rgba(20, 20, 20, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px 30px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 15px rgba(138, 43, 226, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-sizing: border-box;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1), transform 1s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2;
        }

        /* Класс, который плавно проявит карточку после закрытия окна Линукс */
        .bio-container.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Главное фото/аватар */
        .avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #8a2be2;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.4);
            margin-bottom: 20px;
        }

        /* --- ЭФФЕКТ ГЛИТЧА ДЛЯ ЗАГОЛОВКА --- */
        .glitch-title {
            font-size: 26px;
            font-weight: bold;
            margin: 10px 0;
            color: #ffffff;
            letter-spacing: 1px;
            position: relative;
            text-shadow: 0 2px 10px rgba(138, 43, 226, 0.5);
        }

        .glitch-title::before,
        .glitch-title::after {
            content: "GHOSTmountain";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        .glitch-title::before {
            left: 2px;
            text-shadow: -2px 0 #ff00ff;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 5s infinite linear alternate-reverse;
        }

        .glitch-title::after {
            left: -2px;
            text-shadow: -2px 0 #00ffff, 0 2px 3px rgba(0,0,0,0.3);
            clip: rect(85px, 450px, 140px, 0);
            animation: glitch-anim2 5s infinite linear alternate-reverse;
        }

        .glitch-title:hover::before {
            animation: glitch-anim 0.3s infinite linear alternate-reverse;
        }
        .glitch-title:hover::after {
            animation: glitch-anim2 0.3s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(31px, 9999px, 94px, 0); }
            10% { clip: rect(112px, 9999px, 76px, 0); }
            20% { clip: rect(85px, 9999px, 5px, 0); }
            30% { clip: rect(27px, 9999px, 115px, 0); }
            40% { clip: rect(73px, 9999px, 29px, 0); }
            50% { clip: rect(118px, 9999px, 142px, 0); }
            60% { clip: rect(9px, 9999px, 53px, 0); }
            70% { clip: rect(67px, 9999px, 122px, 0); }
            80% { clip: rect(36px, 9999px, 81px, 0); }
            90% { clip: rect(141px, 9999px, 18px, 0); }
            100% { clip: rect(55px, 9999px, 100px, 0); }
        }

        @keyframes glitch-anim2 {
            0% { clip: rect(76px, 9999px, 116px, 0); }
            11% { clip: rect(22px, 9999px, 59px, 0); }
            22% { clip: rect(122px, 9999px, 6px, 0); }
            33% { clip: rect(9px, 9999px, 84px, 0); }
            44% { clip: rect(83px, 9999px, 134px, 0); }
            55% { clip: rect(3px, 9999px, 42px, 0); }
            66% { clip: rect(110px, 9999px, 120px, 0); }
            77% { clip: rect(45px, 9999px, 95px, 0); }
            88% { clip: rect(29px, 9999px, 149px, 0); }
            100% { clip: rect(68px, 9999px, 33px, 0); }
        }

        p.subtitle {
            font-size: 14px;
            color: #b0b0b0;
            font-weight: 500;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }

        /* Ссылки-кнопки */
        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        .bio-link {
            display: flex;
