<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIO GHOSTmountain</title>
    <style>
        /* Общие настройки страницы */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #4a4a4a;
            overflow-x: hidden;
        }

        /* Стиль для видео на заднем фоне */
        .video-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -2;
            transform: translate(-50%, -50%);
            object-fit: cover;
            /* Небольшое размытие, чтобы видео не отвлекало от текста */
            filter: blur(4px) brightness(85%); 
        }

        /* Затемняющий слой поверх видео, чтобы добавить романтичный розовый оттенок */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 229, 236, 0.3);
            z-index: -1;
        }

        /* Контейнер сайта (главная карточка) */
        .bio-container {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 40px 30px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-sizing: border-box;
        }

        /* Главное фото/аватар */
        .avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ff85a1;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        /* Заголовки */
        h1 {
            font-size: 24px;
            margin: 10px 0;
            color: #ff477e;
            text-shadow: 0 1px 2px rgba(255,255,255,0.8);
        }

        p.subtitle {
            font-size: 14px;
            color: #4a4a4a;
            font-weight: 500;
            margin-bottom: 25px;
        }

        /* Ссылки-кнопки */
        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .bio-link {
            display: block;
            padding: 14px;
            background-color: rgba(255, 255, 255, 0.9);
            color: #ff477e;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 2px solid #ffb3c6;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        /* Анимация при наведении */
        .bio-link:hover {
            background-color: #ff477e;
            color: #ffffff;
            border-color: #ff477e;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(255, 71, 126, 0.3);
        }

        /* Кнопка управления музыкой */
        .music-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid #ffb3c6;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            z-index: 10;
        }

        .music-btn:hover {
            transform: scale(1.1);
            background: #ff477e;
            color: white;
            border-color: #ff477e;
        }

        /* Музыкальная анимация вращения кнопки, когда трек играет */
        .playing {
            animation: rotate 4s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Футер */
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #ff477e;
            font-weight: 500;
        }

        .heart {
            color: #ff477e;
            display: inline-block;
            animation: heartbeat 1.2s infinite;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            20% { transform: scale(1.1); }
            40% { transform: scale(1); }
            60% { transform: scale(1.1); }
            80% { transform: scale(1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- Кнопка включения/выключения музыки -->
    <button class="music-btn" id="musicBtn">🎵</button>

    <!-- Тег для аудио-файла (музыка) -->
    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- Тег для фонового видео -->
    <video autoplay loop muted playsinline class="video-bg">
        <source src="background.mp4" type="video/mp4">
    </video>

    <!-- Полупрозрачный слой поверх видео -->
    <div class="overlay"></div>

    <!-- Основная карточка -->
    <div class="bio-container">
        <img src="avatar.jpg" alt="sematary" class="avatar">

        <h1>GHOSTmountain</h1>
        <p class="subtitle">GHOST</p>

        <div class="links-wrapper">
            <a href="https://vk.com/aferist2347" target="_blank" class="bio-link">VK link</a>
            <a href="https://t.me/awert1top" target="_blank" class="bio-link">My BIO (tg)</a>
            <a href="https://t.me/GHOSTmountain2347" target="_blank" class="bio-link">My account</a>
            <a href="https://t.me/psyhotropi" target="_blank" class="bio-link">My DEF</a>
        </div>

        <div class="footer">
            @GHOSTmountain2347 <span class="heart">❤️</span> 2026
        </div>
    </div>

    <!-- Скрипт, который включает и выключает музыку по клику -->
    <script>
        const music = document.getElementById('bgMusic');
        const btn = document.getElementById('musicBtn');

        btn.addEventListener('click', () => {
            if (music.paused) {
                music.play();
                btn.classList.add('playing');
                btn.textContent = '⏸️'; // Меняем иконку на паузу
            } else {
                music.pause();
                btn.classList.remove('playing');
                btn.textContent = '🎵'; // Возвращаем ноту
            }
        });
    </script>

</body>
</html>
